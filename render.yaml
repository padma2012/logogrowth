# Render.com blueprint. In Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: logogrowth
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn logogrowth.webapp:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      # Set a value in the Render dashboard to password-protect the site.
      - key: LOGOGROWTH_PASSWORD
        sync: false
      - key: LOGOGROWTH_USER
        value: vc
