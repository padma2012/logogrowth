[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logogrowth"
version = "0.1.0"
description = "Track a SaaS company's customer/partner logo wall over time using the Wayback Machine."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
render = ["playwright>=1.40"]
chart = ["matplotlib>=3.6"]
web = ["flask>=2.3"]

[project.scripts]
logogrowth = "logogrowth.cli:main"
logogrowth-web = "logogrowth.webapp:main"

[tool.setuptools]
packages = ["logogrowth"]

[tool.setuptools.package-data]
logogrowth = ["templates/*.html"]
